spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/courseflow}
spring.datasource.username=${DB_USERNAME:courseflow}
spring.datasource.password=${DB_PASSWORD:courseflow_local}
spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration,classpath:db/seed
# Shared Supabase may already have migrations from other branches (e.g. V5 promo codes).
# Checksum mismatches happen when V6 was applied as sub-lesson work, then checkout took V6.
spring.flyway.ignore-migration-patterns=*:missing,*:checksum
spring.flyway.validate-on-migrate=false
# Allow pending lower versions (e.g. V6/V7) after a higher version was applied first.
spring.flyway.out-of-order=true

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
courseflow.upload.dir=${COURSEFLOW_UPLOAD_DIR:uploads}
